[project]
name = "cdp-python-backend-template"
version = "0.1.0"
description = "CDP Python Backend Template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgi-logger==0.1.0",
    "aws-embedded-metrics==3.5.0",
    "dnspython==2.8.0",
    "ecs-logging==2.3.0",
    "fastapi==0.141.1",
    "httpx2==2.13.0",
    "pydantic-settings==2.15.0",
    "pymongo[aws,encryption,snappy,zstd]==4.18.1",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.16.7",
    "taskipy==1.14.1",
]

[tool.coverage.run]
branch = true
include = ["app/*"]
omit = ["app/**/test_*.py"]

[tool.coverage.html]
directory = "coverage/coverage_html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
test = "uv run task format && uv run pytest -q --cov=app --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/coverage_html"

[tool.uv]
exclude-newer = "1 week"
